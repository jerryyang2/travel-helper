  <header class="wrap topbar">

    <button class="button" id="settings-open" type="button"><span data-icon="edit"></span>編輯旅程</button>

  <div class="wrap" id="trip-switcher" aria-label="城市與旅程切換"></div>

  <main id="main" class="wrap">
    <nav class="nav" id="main-menu" role="tablist" aria-label="旅行主選單">
      <button class="nav-tab" id="tab-overview" role="tab" aria-controls="overview" aria-selected="true" data-panel="overview"><span data-icon="sun"></span><span>總覽</span></button>
      <button class="nav-tab" id="tab-itinerary" role="tab" aria-controls="itinerary" aria-selected="false" tabindex="-1" data-panel="itinerary"><span data-icon="calendar"></span><span>每日行程</span></button>
      <button class="nav-tab" id="tab-checklist" role="tab" aria-controls="checklist" aria-selected="false" tabindex="-1" data-panel="checklist"><span data-icon="checklist"></span><span>行前清單</span></button>
      <button class="nav-tab" id="tab-stay" role="tab" aria-controls="stay" aria-selected="false" tabindex="-1" data-panel="stay"><span data-icon="hotel"></span><span>住宿速查</span></button>
    </nav>
    <section class="panel" id="overview" role="tabpanel" aria-labelledby="tab-overview" tabindex="0"></section>
    <section class="panel" id="itinerary" role="tabpanel" aria-labelledby="tab-itinerary" tabindex="0" hidden></section>
    <section class="panel" id="checklist" role="tabpanel" aria-labelledby="tab-checklist" tabindex="0" hidden></section>
    <section class="panel" id="stay" role="tabpanel" aria-labelledby="tab-stay" tabindex="0" hidden></section>
  </main>

  function renderItinerary(animate=false){const i=selectedDay,d=state.days[i],all=getStops(),shown=all.filter(s=>filter==='all'||filter==='todo'&&!isDone(i,s.id)||filter==='must'&&s.must);$('#itinerary').innerHTML=`<div class="section-head"><div><h2>旅途中的每一天</h2><p class="muted">行程時間依 ${esc(state.config.timeZone)} 顯示。</p></div><button class="button" data-action="today">${icon('pin')}今天</button></div>${ideasHTML()}<div class="date-tabs" role="tablist" aria-label="選擇旅行日期">${state.days.map((day,n)=>`<button class="date-tab" role="tab" id="day-tab-${n}" aria-controls="day-content" aria-selected="${i===n}" tabindex="${i===n?'0':'-1'}" data-action="day" data-index="${n}"><span>第 ${n+1} 天</span><strong>${fmtDate(dateAt(n))}</strong><span>星期${weekday(dateAt(n))}</span></button>`).join('')}</div><div id="day-content" role="tabpanel" aria-labelledby="day-tab-${i}"><div class="day-toolbar"><div><h3>${esc(d.title)}</h3><p class="day-progress">${esc(d.subtitle)}</p></div><div class="segmented" aria-label="天氣替代方案"><button data-action="mode" data-mode="sunny" aria-pressed="${getMode()==='sunny'}">${icon('sun')}晴天</button><button data-action="mode" data-mode="rainy" aria-pressed="${getMode()==='rainy'}">${icon('rain')}雨天</button></div></div>${summaryHTML(i)}<div class="flow between" style="margin:0 0 20px"><div class="segmented" aria-label="行程篩選">${[['all','全部'],['todo','尚未完成'],['must','必去']].map(([v,l])=>`<button data-action="filter" data-filter="${v}" aria-pressed="${filter===v}">${l}</button>`).join('')}</div><span class="day-progress">已完成 ${all.filter(s=>isDone(i,s.id)).length} / ${all.length} 個安排</span></div><details class="card" style="padding:13px 18px;margin-bottom:20px"><summary style="cursor:pointer;font-weight:600">${icon('train')} 當日移動速覽</summary><p class="small muted" style="margin-top:8px">${all.map(s=>esc(s.title)).join(' ／ ')}</p><p class="small muted" style="margin-top:8px">交通段為範例估算；每段詳細路線請看下方時間軸，地圖可查看各站位置。</p><div class="flow" style="margin-top:12px">${all.map(s=>s.map?`<a class="badge" href="${esc(mapURL(s.map))}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a>`:'').join('')}</div></details><div class="arrange-tools"><button class="button" data-action="arrange-toggle" aria-pressed="${arranging}">${arranging?'展開完整卡片':'精簡卡片，方便拖曳'}</button><p>按住「拖曳」把手排序；拖到下方日期可跨日。點把手也能選日期。</p></div>${reviewNotice(all)}${scheduleNotice(all)}<div class="timeline ${arranging?'arranging':''} ${animate?'reveal':''}">${shown.length?shown.map((s,n)=>`${n?transitHTML(s,shown[n-1],filter==='all'):''}${activityHTML(s,i,n)}`).join(''):'<div class="empty card">這個篩選下沒有行程。切換「全部」，或新增想去的地方。</div>'}</div><div class="add-stop"><button class="button" data-action="stop-add">${icon('plus')}新增${getMode()==='rainy'?'雨天':'晴天'}行程</button></div><div class="daily-bottom" id="daily-expenses">${dailyExpenses(i)}${journalHTML(i)}</div></div>${backMenu()}`}
  function expenseRows(expenses){return expenses.length?`<ul class="expense-list">${expenses.map(e=>`<li class="expense-row"><span class="expense-name">${esc(e.name)}<br><span class="small muted">${esc(e.category)}・${exchangeRate(e.currency)===null?'待設定匯率':'約 NT$'+money(expenseTWD(e))}</span></span><strong>${amountLabel(e.amount,e.currency)}</strong><button class="button icon-only" data-action="expense-edit" data-id="${esc(e.id)}" aria-label="編輯支出${esc(e.name)}">${icon('edit')}</button><button class="text-button" data-action="expense-delete" data-id="${esc(e.id)}" aria-label="刪除支出${esc(e.name)}">${icon('trash')}</button></li>`).join('')}</ul>`:'<p class="empty">今天還沒有記帳，先記下第一筆吧。</p>'}
  function dailyExpenses(i){const list=state.expenses.filter(e=>e.day===i),sum=list.reduce((a,e)=>a+expenseTWD(e),0);return `<article class="card"><div class="flow between"><h3 class="flex">${icon('wallet')}今天花了多少？</h3><button class="text-button" data-action="settings">匯率設定</button></div><p class="small muted" style="margin:8px 0 16px">${state.config.rate===null?'旅行幣別匯率尚未設定':'1 '+currencyName(tripCurrency())+'＝'+state.config.rate+' 新台幣'}・手動匯率</p>${conversionNote()}<form id="expense-form" class="expense-form"><div class="field expense-item-field"><label for="expense-name">項目</label><input id="expense-name" name="name" placeholder="例如：午餐拉麵" maxlength="200" required></div><div class="field"><label for="expense-amount">金額</label><input id="expense-amount" name="amount" type="number" inputmode="decimal" min="0.01" max="1000000000" step="any" placeholder="1200" required></div><div class="field"><label for="expense-currency">幣別</label><select id="expense-currency" name="currency">${currencyOptions().map(([code,label])=>`<option value="${code}" ${code===tripCurrency()?'selected':''}>${label}</option>`).join('')}</select></div><button class="button primary" type="submit">${icon('plus')}記一筆</button></form>${expenseRows(list)}<div class="expense-total"><span>當日支出合計</span><strong>NT$${money(sum)}</strong></div><p class="small muted" style="text-align:right">${currencyName(tripCurrency())} ${amountLabel(totalForeign(i),tripCurrency())}・台幣合計僅含已設定匯率的支出</p></article>`}
  function checkStats(){const items=[...state.checklists.todo,...state.checklists.packing],done=items.filter(a=>a.done).length;return{done,total:items.length,percent:items.length?Math.round(done/items.length*100):0}}
  function renderChecklist(){const s=checkStats();$('#checklist').innerHTML=`<div class="section-head"><div><h2>準備好，就安心出發</h2><p class="muted">把瑣碎的小事，一件一件收好。</p></div></div><div class="card check-total"><div><strong>${s.percent}%</strong><p class="small muted">準備進度</p></div><div class="progress-section"><div class="flow between"><span>已完成 ${s.done} 項</span><span class="small muted">共 ${s.total} 項</span></div><div class="progress-bar" role="progressbar" aria-label="行前準備進度" aria-valuenow="${s.percent}" aria-valuemin="0" aria-valuemax="100"><span style="width:${s.percent}%"></span></div></div></div><div class="grid-2">${[['todo','checklist','行前待辦'],['packing','bag','行李準備']].map(([key,ic,title])=>`<article class="card"><div class="flex between"><h3 class="flex">${icon(ic)}${title}</h3><span class="badge green">${state.checklists[key].filter(a=>a.done).length} / ${state.checklists[key].length}</span></div><ul class="check-list">${state.checklists[key].map(a=>`<li class="check-row ${a.done?'completed':''}"><label><input type="checkbox" data-check-id="${esc(a.id)}" data-group="${key}" ${a.done?'checked':''}><span>${esc(a.text)}</span></label><button data-action="check-delete" data-group="${key}" data-id="${esc(a.id)}" aria-label="移除${esc(a.text)}">${icon('close')}</button></li>`).join('')||'<li class="empty">尚未建立清單，加入第一個項目吧。</li>'}</ul><form class="add-check-form" data-check-form="${key}"><div class="field"><label for="new-${key}">新增項目</label><input id="new-${key}" name="text" placeholder="還有什麼要準備？" maxlength="300" required></div><button class="button" type="submit" aria-label="新增${title}">${icon('plus')}</button></form></article>`).join('')}</div>${backMenu()}`}
  function hotelHTML(h){const nights=state.days.flatMap((d,i)=>d.hotelId===h.id?[fmtDate(dateAt(i))]:[]);return `<article class="card hotel-card"><div class="hotel-stripe"><div class="hotel-icon">${icon('hotel')}</div><div class="flow">${ex(h.example)}<button class="text-button" data-action="hotel-edit" data-id="${esc(h.id)}">編輯住宿</button></div></div><h3>${esc(h.name)}</h3><p class="small muted" style="margin-top:8px">${nights.length?`${nights.join('、')}・共 ${nights.length} 晚`:'尚未指定住宿日期'}</p><dl class="info-grid"><div class="full"><dt>詳細地址</dt><dd>${esc(h.address||'待填寫')}</dd></div><div class="full"><dt>最近車站</dt><dd>${esc(h.station||'待填寫')}・步行約 ${h.walk} 分鐘</dd></div><div><dt>入住時間${h.example?'（範例）':''}</dt><dd>${esc(h.checkIn)}</dd></div><div><dt>退房時間${h.example?'（範例）':''}</dt><dd>${esc(h.checkOut)}</dd></div></dl><p class="small muted">訂房編號</p><p class="booking-code">${esc(h.booking||'待填寫')}</p><div class="flow" style="margin-top:17px">${mapButton(h.map||h.address)}<button class="button" data-action="hotel-expense" data-id="${esc(h.id)}">${icon('wallet')}記一筆住宿費</button></div></article>`}
  function budgetHTML(){const sum=totalTWD(),remaining=state.config.budget-sum,categories=['餐飲','交通','購物','住宿','機票','其他'];return `<article class="card" style="margin-top:24px"><div class="flow between"><h3 class="flex">${icon('wallet')}這趟旅行的花費</h3><button class="text-button" data-action="settings">預算與匯率設定</button></div><div class="budget-top"><div><span class="small muted">已換算總支出</span><strong>NT$${money(sum)}</strong><span class="small muted">共 ${state.expenses.length} 筆・${currencyName(tripCurrency())} ${amountLabel(totalForeign(),tripCurrency())}</span></div><div><span class="small muted">${remaining<0?'超出預算':'預算餘額'}</span><strong style="font-size:24px;color:${remaining<0?'#AD2E22':'var(--green)'}">NT$${money(Math.abs(remaining))}</strong><span class="small muted">預算 NT$${money(state.config.budget)}</span></div></div><div class="progress-bar" role="progressbar" aria-label="預算使用比例" aria-valuenow="${state.config.budget?Math.min(100,Math.round(sum/state.config.budget*100)):0}" aria-valuemin="0" aria-valuemax="100"><span style="width:${state.config.budget?Math.min(100,sum/state.config.budget*100):0}%;background:${remaining<0?'var(--red)':'var(--green)'}"></span></div>${conversionNote()}<div class="budget-bars">${categories.map((cat,i)=>{const value=state.expenses.filter(e=>e.category===cat).reduce((a,e)=>a+expenseTWD(e),0);return `<div class="budget-row"><span>${cat}</span><div class="budget-track"><span style="width:${sum?value/sum*100:0}%;background:${['var(--yellow)','var(--blue)','var(--pink)','var(--green)','var(--navy)','var(--muted)'][i]}"></span></div><strong>NT$${money(value)}</strong></div>`}).join('')}</div><table class="budget-table"><caption class="sr-only">每日支出統計</caption><thead><tr><th scope="col">日期</th><th scope="col">旅行幣別支出</th><th scope="col">換算合計</th></tr></thead><tbody>${state.days.map((d,i)=>`<tr><td>${fmtDate(dateAt(i))}・第 ${i+1} 天</td><td>${amountLabel(totalForeign(i),tripCurrency())}</td><td>NT$${money(state.expenses.filter(e=>e.day===i).reduce((a,e)=>a+expenseTWD(e),0))}</td></tr>`).join('')}</tbody></table><p class="small muted" style="margin-top:13px">已設定匯率的支出依各幣別手動匯率換算，未計入刷卡手續費；未輸入的範例預算不列入實支。退稅可在實際收到後修改對應支出為淨額。</p></article>`}
  function renderStay(){const jp=state.config.country.trim()==='日本';$('#stay').innerHTML=`<div class="section-head"><div><h2>把重要資訊，放在一起</h2><p class="muted">住宿、預約與旅行花費，隨手就能找到。</p></div><button class="button" data-action="hotel-add">${icon('plus')}新增住宿</button></div><div class="grid-2">${state.hotels.map(hotelHTML).join('')||'<p class="empty card">尚未新增住宿。</p>'}</div>${safetyHub()}<div class="practical-grid">${destinationNotes()}<article class="card"><div class="flow between"><h3 class="flex">${icon('info')}預約與安心速查</h3><button class="text-button" data-action="practical">編輯</button></div><dl class="info-grid"><div class="full"><dt>餐廳預約／訂位編號</dt><dd>${esc(state.practical.restaurant||'待填寫')}</dd></div><div class="full"><dt>保險資料</dt><dd>${esc(state.practical.insurance||'待填寫')}</dd></div><div class="full"><dt>海外協助電話</dt><dd>${esc(state.practical.assistance||'待填寫')}</dd></div></dl><h3 style="font-size:17px">旅途緊急聯絡</h3>${jp?`<div class="emergency-grid"><a class="emergency" href="tel:110"><span>警察</span><strong>110</strong></a><a class="emergency" href="tel:119"><span>消防／救護</span><strong>119</strong></a></div><button class="button" style="width:100%;margin-top:14px" data-action="sos">${icon('phone')}SOS 求助卡・放大顯示</button>`:'<p class="notice" style="margin-top:10px">請到上方安心查詢確認當地緊急電話與駐外館處，並在預約與保險資料中記下重要聯絡方式。</p>'}<p class="small muted" style="margin-top:14px">訂位與保險欄位預載無效範例；匯出分享前請檢查個人資料。</p></article></div>${budgetHTML()}${backMenu()}`}
  // 官方查詢入口與固定資料分開；本頁不推定即時警示等級。
  const SAFETY_INFO={checked:'2026-11-19',office:'駐福岡辦事處',international:'+81-90-1922-9740',local:'090-1922-9740',officeURL:'https://www.boca.gov.tw/sp-foof-countrycp-03-31-92761-03-1.html',advisory:'https://www.boca.gov.tw/sp-trwa-list-1.html',visa:'https://www.mofa.go.jp/j_info/visit/visa/short/novisa.html',health:'https://www.cdc.gov.tw/InternationalTravel/Index/ZkNLTkRxQ0NyQmc5Rk50dmZZZlI2Zz09?keyword=%E6%97%A5%E6%9C%AC',weather:'https://www.jma.go.jp/bosai/forecast/'};

  const sourceLink=(url,text)=>`<a class="button" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${text}</a>`;
  function destinationNotes(){return isFukuoka()?`<article class="card"><h3 class="flex">${icon('shop')}福岡伴手禮散步地圖</h3><p class="small muted" style="margin-top:7px">福岡購物範例；其他目的地請自行核對。</p><div class="shopping-area"><h3>博多站周邊</h3><p>博多通饅頭、明太子仙貝、八女茶。集中採買較方便；注意食品保存方式。</p></div><div class="shopping-area"><h3>天神與地下街</h3><p>服飾、藥妝、設計雜貨。百貨退稅櫃檯可能有截止時間與服務費。</p></div><div class="shopping-area"><h3>中洲・川端</h3><p>博多織小物、傳統工藝。小店不一定提供退稅，購物前先詢問。</p></div><p class="notice">日本 2026/11/1 起改採先付含稅價、離境時經海關確認攜出後退款的新制度。退稅款未必現場入帳；請保留物品與購物紀錄，並預留機場辦理時間。</p><p class="small" style="margin-top:10px"><a href="https://www.customs.go.jp/kaigairyoko/taxrefund.htm" target="_blank" rel="noopener noreferrer">日本海關退稅制度說明</a></p></article>`:`<article class="card"><h3>這趟旅行的小筆記</h3><p class="small muted" style="margin-top:12px">${esc(state.config.destination)}的餐廳、購物與住宿資訊可自行加入行程，或先放進待排靈感匣。</p><p class="small" style="margin-top:12px">旅行時區：${esc(state.config.timeZone)}<br>記帳幣別：${currencyName(tripCurrency())}</p><button class="button" data-action="go-day" data-index="0" style="margin-top:16px">開始安排景點</button></article>`}

ton><button class="button" data-action="sos">${icon('phone')}放大求助句</button></div><p class="small muted" style="margin-top:9px">PNG 圖片可另存至手機相簿；只包含公開急難資訊，不包含您的保單、訂房或私人資料。</p></div>`:'<p class="notice" style="margin-top:17px">日本急難卡不適用此目的地。請至外交部查詢當地緊急電話與駐外館處。</p>'}<p class="safety-footnote">本頁提供查詢連結，不會自動更新官方公告；連結與急難資料核對日：${SAFETY_INFO.checked}。下載的圖片也不會隨公告自動更新。</p><p class="safety-network" id="safety-network"></p><p class="small" style="margin-top:14px">想探索其他國家？<a href="https://www.anlutrip.com/" target="_blank" rel="noopener noreferrer">開啟安心旅圖（非政府網站）</a>，重要條件仍請核對原始官方公告。</p></article>`}

  function conflicts(stops){const minutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3));const result=[];for(let i=0;i<stops.length;i++)for(let j=i+1;j<stops.length;j++){const a=stops[i],b=stops[j];if(minutes(b.time)<minutes(a.time)+a.duration&&minutes(a.time)<minutes(b.time)+b.duration)result.push([a,b])}return result}
  function scheduleNotice(stops){const overlaps=conflicts(stops);return overlaps.length?`<aside class="schedule-warning" role="status"><strong>有 ${overlaps.length} 組活動時間重疊</strong>${overlaps.slice(0,3).map(([a,b])=>`<p>${esc(a.time)} ${esc(a.title)} ／ ${esc(b.time)} ${esc(b.title)}</p>`).join('')}<p>請調整開始時間或停留長度；此檢查未包含交通時間。</p></aside>`:''}
  function ideasHTML(){return `<details class="card ideas-box" id="ideas-box"><summary>待排靈感匣・${state.ideas.length} 個想去的地方</summary><div class="ideas-intro"><p>先收藏，再決定哪一天去。加入行程時才填時間，晴雨版本分別安排。</p><button class="button" data-action="idea-add">${icon('plus')}收藏一個地點</button></div><div class="ideas-grid">${state.ideas.map(s=>`<article class="idea-card ${s.type}"><span class="badge">${TYPES[s.type][1]}</span><h3>${esc(s.title)}</h3><p>${esc(s.note)}</p><div class="idea-actions"><button class="button" data-action="idea-plan" data-id="${esc(s.id)}">${icon('calendar')}排進某一天</button>${mapButton(s.map,'地圖')}<button class="button icon-only" data-action="idea-edit" data-id="${esc(s.id)}" aria-label="編輯靈感${esc(s.title)}">${icon('edit')}</button><button class="button icon-only" data-action="idea-delete" data-id="${esc(s.id)}" aria-label="移除靈感${esc(s.title)}">${icon('trash')}</button></div></article>`).join('')||'<p class="empty">還沒有收藏。先記下想去的地方，不急著排滿每一天。</p>'}</div></details>`}
  function openIdea(id=null){const old=state.ideas.find(x=>x.id===id),s=old||{id:uid(),title:'',type:'sight',map:'',note:''};openDialog(old?'編輯待排靈感':'先收藏一個地方',`<form id="idea-form"><div class="form-grid">${field('title','地點名稱',s.title,{required:true,full:true})}${selectField('type','類型',Object.entries(TYPES).map(([k,[ic,l]])=>[k,l]),s.type,true)}${field('map','地圖搜尋地點',s.map,{full:true})}${field('note','為什麼想去？',s.note,{textarea:true,full:true})}</div>${actions(old?'儲存靈感':'加入靈感匣')}</form>`);$('#idea-form').onsubmit=e=>{e.preventDefault();const data=formData(e.target);if(!data.title.trim()||data.title.length>300)return formError('請填寫 1–300 字的地點名稱。');const idea={id:s.id,title:data.title.trim(),type:data.type,map:data.map.trim(),note:data.note.trim()};if(old)state.ideas[state.ideas.indexOf(old)]=idea;else{if(state.ideas.length>=300)return formError('靈感匣最多支援 300 個地點。');state.ideas.push(idea)}save();dialog.close();renderAll();setPanel('itinerary');$('#ideas-box').open=true;toast('已保存靈感，之後再決定哪天去')}}
  function planIdea(id){const idea=state.ideas.find(s=>s.id===id);if(!idea)return;openDialog('把靈感排進旅程',`<p>${esc(idea.title)}</p><form id="plan-idea-form"><div class="form-grid">${selectField('day','安排日期',state.days.map((d,i)=>[i,`${fmtDate(dateAt(i))}・第 ${i+1} 天`]),selectedDay,true)}${selectField('mode','行程版本',[['sunny','晴天'],['rainy','雨天']],getMode(),true)}${field('time','開始時間','10:00',{type:'time',required:true})}${field('duration','停留時間（分鐘）',60,{type:'number',min:1,max:1440,step:1,required:true})}</div><label class="check-label" style="margin-top:14px"><input type="checkbox" name="fixed">固定時間（已訂位／預約）</label><p class="small muted">加入後會從靈感匣移至所選版本。時間重疊會提示；交通需再補上。</p>${actions('加入這一天')}</form>`);$('#plan-idea-form').onsubmit=e=>{e.preventDefault();const d=formData(e.target),day=Number(d.day),duration=Number(d.duration);if(!Number.isInteger(day)||!state.days[day]||!['sunny','rainy'].includes(d.mode)||!validTime(d.time)||!Number.isInteger(duration)||duration<1||duration>1440)return formError('請確認安排日期、時間與停留分鐘。');const list=state.days[day][d.mode];if(list.length>=100)return formError('這一天已有 100 個安排，請改選其他日期。');const before=structuredClone(list);list.push({id:uid(),title:idea.title,type:idea.type,desc:idea.note,map:idea.map,time:d.time,duration,transit:'新加入的安排，請確認交通工具、起訖站、搭乘及步行時間。',example:false,must:false,fixed:!!d.fixed});list.sort((a,b)=>a.time.localeCompare(b.time));invalidateEdges(list,before);state.ideas=state.ideas.filter(x=>x.id!==id);selectedDay=day;dayModes[day]=d.mode;filter='all';save();dialog.close();renderAll();setPanel('itinerary');toast('已排進行程；請核對時間與交通')}}

  function openSettings(){const c=state.config;openDialog('編輯這趟旅行',`<p class="small muted">封面標題與短句都能寫成自己的風格。城市插畫會自動更換；未收錄城市會顯示旅行風景。想規劃另一座城市，請從「我的旅程」新增，保留原有安排。</p><form id="settings-form"><div class="form-grid">${field('name','旅行名稱／手帳封面標題',c.name,{required:true,full:true})}${field('tagline','封面短句',c.tagline||'把日子，留給喜歡的風景。',{full:true,help:'寫一句自己的旅行心情，最多 100 字。'})}${field('destination','目的地',c.destination,{required:true})}${field('country','國家／地區',c.country,{required:true})}${field('startDate','出發日期',c.startDate,{type:'date',required:true})}${field('days','旅遊天數',c.days,{type:'number',min:1,max:30,step:1,required:true,help:'支援 1–30 天；結束日期與星期自動更新。'})}${field('timeZone','目的地時區',c.timeZone,{required:true,full:true,help:'例如日本 Asia/Tokyo、台灣 Asia/Taipei。'})}${selectField('currency','旅行記帳幣別',currencyOptions(),tripCurrency(),true)}${field('rate','1 單位旅行幣別＝多少新台幣',c.rate??'',{type:'number',min:.000001,max:1000,step:'any',help:'可留白；只有已設定匯率的支出會計入台幣合計。'})}${field('budget','總預算（新台幣）',c.budget,{type:'number',min:0,max:1e10,step:1,required:true})}</div>${actions()}</form><details><summary>開始另一趟旅行</summary><p class="small muted" style="margin:10px 0">先備份目前資料。新增空白旅程或福岡範例會另行保存，原有城市旅程不受影響。</p><div class="flow"><button class="button" data-action="new-trip">建立空白旅程</button><button class="button danger" data-action="reset">載入福岡範例</button></div></details>`);$('#settings-form [name="currency"]').onchange=e=>{$('#settings-form [name="rate"]').value=exchangeRate(e.target.value)??''};$('#settings-form').onsubmit=e=>{e.preventDefault();const d=formData(e.target);const n=Number(d.days),rate=d.currency==='TWD'?1:d.rate===''?null:Number(d.rate),budget=Number(d.budget);if(!validDate(d.startDate)||!Number.isInteger(n)||n<1||n>30||!validZone(d.timeZone)||!(rate===null||rate>0&&rate<=1000)||!(budget>=0&&budget<=1e10))return formError('請確認日期、1–30 天的天數、有效時區、匯率與預算。');if(d.tagline.trim().length>100)return formError('封面短句請填寫 100 字以內。');if(!d.name.trim()||!d.destination.trim()||d.name.trim().length>100||d.destination.trim().length>100||d.country.length>100)return formError('請填寫 100 字以內的旅行名稱、目的地與國家。');const apply=()=>{const oldDays=state.config.days;state.config={...c,name:d.name.trim(),tagline:d.tagline.trim().slice(0,100),destination:d.destination.trim(),country:d.country.trim(),startDate:d.startDate,days:n,timeZone:d.timeZone.trim(),currency:d.currency,rate,rates:{...(c.rates||{}),[d.currency]:rate},budget};if(n>oldDays)for(let i=oldDays;i<n;i++)state.days.push(blankDay(i));if(n<oldDays){state.days=state.days.slice(0,n);state.expenses=state.expenses.filter(e=>e.day<n);state.completed=state.completed.filter(id=>Number(id.split(':')[0])<n)}selectedDay=Math.min(selectedDay,n-1);save();dialog.close();renderAll();toast('旅程已更新')};if(n<c.days)confirmAction('縮短旅程天數',`將移除第 ${n+1} 天起的行程、手記、完成紀錄及支出。建議先取消並備份資料，再確認縮短。`,apply);else apply()}}
  function blankDay(i){return{title:`第 ${i+1} 天，留給喜歡的風景`,subtitle:'加入想去的地方，慢慢安排一天。',weather:{kind:'sun',high:20,low:12,rain:20,unset:true,outfit:'尚未填寫穿搭提醒，請依目的地與實際天氣補上。'},hotelId:null,sunny:[],rainy:[]}}

  function openFlight(i){const f=state.flights[i];openDialog(`編輯${i?'回程':'去程'}航班`, `<p class="small muted">日期依旅程第 ${i?state.config.days:1} 天計算。起飛與抵達時間請填各機場當地時間。</p><form id="flight-form"><div class="form-grid">${field('airline','航空公司',f.airline)}${field('number','航班編號',f.number)}${field('fromCode','出發機場代碼',f.fromCode)}${field('toCode','抵達機場代碼',f.toCode)}${field('fromName','出發機場名稱',f.fromName)}${field('toName','抵達機場名稱',f.toName)}${field('fromTerminal','出發航廈',f.fromTerminal)}${field('toTerminal','抵達航廈',f.toTerminal)}${field('departure','當地起飛時間',f.departure,{type:'time',required:true})}${field('arrival','當地抵達時間',f.arrival,{type:'time',required:true})}${field('fromZone','出發機場時區',f.fromZone,{required:true,help:'例如 Asia/Taipei'})}${field('toZone','抵達機場時區',f.toZone,{required:true,help:'例如 Asia/Tokyo'})}${selectField('arrivalDay','抵達日',[[0,'起飛當日'],[1,'起飛次日'],[2,'起飛後第 2 日'],[3,'起飛後第 3 日']],f.arrivalDay,true)}</div><label class="check-label" style="margin-top:15px"><input type="checkbox" name="example" ${f.example?'checked':''}>這是範例，尚未確認</label>${actions()}</form>`);$('#flight-form').onsubmit=e=>{e.preventDefault();const d=formData(e.target);if(!validZone(d.fromZone)||!validZone(d.toZone)||!validTime(d.departure)||!validTime(d.arrival))return formError('請輸入有效的時間及時區。');const date=dateAt(i?state.config.days-1:0),arrivalDay=Number(d.arrivalDay);const mins=(zonedTime(dateAt(arrivalDay,date),d.arrival,d.toZone)-zonedTime(date,d.departure,d.fromZone))/60000;if(!(mins>0&&mins<=2880))return formError('飛行時間須大於 0 且不超過 48 小時；請確認時差與抵達日。');state.flights[i]={...f,...d,arrivalDay,example:!!d.example};save();dialog.close();renderAll();toast('航班已更新')}}
  function openDayEditor(){const d=state.days[selectedDay],w=d.weather;openDialog(`第 ${selectedDay+1} 天・每日摘要`,`<form id="day-form"><div class="form-grid">${field('title','當日主題',d.title,{required:true,full:true})}${field('subtitle','一句話介紹',d.subtitle,{full:true})}${selectField('kind','範例天氣圖示',[['sun','晴天'],['cloud','多雲'],['rain','下雨']],w.kind)}${field('rain','降雨機率（%）',w.rain,{type:'number',min:0,max:100,step:1,required:true})}${field('high','最高溫（°C）',w.high,{type:'number',min:-60,max:65,required:true})}${field('low','最低溫（°C）',w.low,{type:'number',min:-60,max:65,required:true})}${field('outfit','穿搭建議',w.outfit,{textarea:true,full:true})}${selectField('hotelId','當晚住宿',[['','無住宿／尚未設定'],...state.hotels.map(h=>[h.id,h.name])],d.hotelId||'',true)}</div><p class="notice" style="margin-top:16px">天氣為手動範例資料，不會自動取得預報。</p>${actions()}</form>`);$('#day-form').onsubmit=e=>{e.preventDefault();const f=formData(e.target);if(Number(f.low)>Number(f.high))return formError('最低溫不能高於最高溫。');if(!f.title.trim()||f.title.trim().length>150)return formError('當日主題請填 1–150 字。');d.title=f.title.trim();d.subtitle=f.subtitle.trim();d.weather={kind:f.kind,high:Number(f.high),low:Number(f.low),rain:Number(f.rain),outfit:f.outfit};d.hotelId=f.hotelId||null;save();dialog.close();renderAll();toast('每日摘要已更新')}}
  function invalidateEdges(list,before,exceptId=''){markMoveReviews(list,before);if(exceptId){const current=list.find(x=>x.id===exceptId);if(current&&before.some(x=>x.id===exceptId&&x.transit!==current.transit))current.transitReview=false}}
  function openStop(id=null){const list=getStops(),old=list.find(s=>s.id===id);const s=old||{id:uid(),time:'10:00',type:'sight',title:'',desc:'',duration:60,map:'',transit:'',must:false,fixed:false,example:false};const index=old?list.indexOf(old):-1;openDialog(old?'編輯這個安排':'新增一段風景',`<form id="stop-form"><div class="form-grid">${field('title','地點／活動名稱',s.title,{required:true,full:true})}${field('time','開始時間',s.time,{type:'time',required:true})}${field('duration','停留時間（分鐘）',s.duration,{type:'number',min:0,max:1440,step:1,required:true})}${selectField('type','活動類型',Object.entries(TYPES).map(([k,[ic,l]])=>[k,l]),s.type)}${field('map','Google 地圖搜尋地點',s.map,{help:'建議填入完整地名與城市。'})}${field('desc','介紹',s.desc,{textarea:true,full:true})}${field('transit','從上一站到這裡的交通',s.transit,{textarea:true,full:true,help:'填寫交通工具、方向、起訖站、搭乘與步行分鐘；第一站不顯示。'})}</div><details ${s.type==='food'?'open':''}><summary>美食資訊</summary><div class="form-grid" style="margin-top:12px">${field('cuisine','料理類型',s.cuisine||'')}${field('budget','每人預算',s.budget||'')}${field('signature','招牌菜色',s.signature||'',{full:true})}${field('booking','訂位建議',s.booking||'',{full:true})}</div></details><details ${s.type==='shop'?'open':''}><summary>購物資訊</summary><div class="form-grid" style="margin-top:12px">${field('products','推薦商品',s.products||'',{full:true})}${field('hours','營業時間',s.hours||'',{full:true})}${field('tax','退稅提醒',s.tax||'',{full:true})}</div></details><div style="margin-top:15px">${field('notes','其他提醒',s.notes||'',{textarea:true})}</div>${s.transitReview?'<label class="check-label" style="margin-top:14px"><input type="checkbox" name="trafficChecked">已核對此安排的交通、步行與銜接時間</label>':''}<div class="flow" style="margin-top:12px"><label class="check-label"><input type="checkbox" name="must" ${s.must?'checked':''}>必去</label><label class="check-label"><input type="checkbox" name="fixed" ${fixedStop(s)?'checked':''}>固定時間（航班／預約）</label><label class="check-label"><input type="checkbox" name="example" ${s.example?'checked':''}>範例資料</label></div>${old?`<p class="small muted">編輯僅影響本日的${getMode()==='sunny'?'晴天':'雨天'}版本，共用完成狀態會保留。</p>`:''}${actions(old?'儲存安排':'加入行程')}</form>${old?`<div class="flow" style="border-top:1px solid #DCE4E6;padding-top:18px;margin-top:20px"><button class="button" data-action="stop-move" data-id="${esc(id)}" data-direction="-1" ${index===0||fixedStop(s)||list[index-1]?.fixed?'disabled':''}>${icon('up')}移到前一時段</button><button class="button" data-action="stop-move" data-id="${esc(id)}" data-direction="1" ${index===list.length-1||fixedStop(s)||list[index+1]?.fixed?'disabled':''}>${icon('down')}移到下一時段</button><button class="button danger" data-action="stop-delete" data-id="${esc(id)}">${icon('trash')}移除安排</button></div><p class="small muted" style="margin-top:9px">調整順序會交換開始時間；固定時間不參與交換。停留時間與受影響的交通段須重新確認。</p>`:''}`);$('#stop-form').onsubmit=e=>{e.preventDefault();const d=formData(e.target);if(!d.title.trim())return formError('請填寫活動名稱。');if(!validTime(d.time))return formError('請填寫有效時間。');const duration=Number(d.duration);if(!Number.isInteger(duration)||duration<0||duration>1440)return formError('停留時間請填 0–1440 的整數分鐘。');const before=structuredClone(list),next={...s,...d,title:d.title.trim(),duration,must:!!d.must,fixed:!!d.fixed,example:!!d.example,transitReview:d.trafficChecked?false:!!s.transitReview};if(old)list[index]=next;else{if(list.length>=100)return formError('單日最多支援 100 個安排。');list.push(next)}list.sort((a,b)=>a.time.localeCompare(b.time));invalidateEdges(list,before);if(d.trafficChecked)next.transitReview=false;save();dialog.close();renderAll();toast('行程已儲存；若順序有變，請檢查交通與時間')};}
  function openHotel(id=null){const old=state.hotels.find(h=>h.id===id),h=old||{id:uid(),name:'',address:'',station:'',walk:5,checkIn:'15:00',checkOut:'11:00',booking:'',map:'',example:false};openDialog(old?'編輯住宿':'新增住宿',`<form id="hotel-form"><div class="form-grid">${field('name','飯店名稱',h.name,{required:true,full:true})}${field('address','詳細地址',h.address,{full:true})}${field('station','最近車站',h.station)}${field('walk','車站步行時間（分鐘）',h.walk,{type:'number',min:0,max:999,step:1,required:true})}${field('checkIn','入住時間',h.checkIn,{type:'time',required:true})}${field('checkOut','退房時間',h.checkOut,{type:'time',required:true})}${field('booking','訂房編號',h.booking,{full:true})}${field('map','地圖搜尋名稱或地址',h.map,{full:true})}</div><label class="check-label" style="margin-top:14px"><input type="checkbox" name="example" ${h.example?'checked':''}>範例住宿，尚未確認</label><p class="small muted" style="margin-top:10px">新增後請至「每日行程 → 天氣與住宿摘要 → 編輯每日摘要」指定住宿日。</p>${actions()}</form>${old?`<button class="text-button" style="color:#AD2E22" data-action="hotel-delete" data-id="${esc(id)}">刪除這間住宿</button>`:''}`);$('#hotel-form').onsubmit=e=>{e.preventDefault();const d=formData(e.target);if(!d.name.trim())return formError('請填寫飯店名稱。');if(!validTime(d.checkIn)||!validTime(d.checkOut))return formError('請確認入住與退房時間。');const next={...h,...d,name:d.name.trim(),walk:Number(d.walk),example:!!d.example};if(old)state.hotels[state.hotels.indexOf(old)]=next;else state.hotels.push(next);save();dialog.close();renderAll();toast('住宿資料已更新')}}

  function help(){openDialog('讓旅行手帖陪你出發',`<p>這是一份可自行編輯的單檔旅遊 App，所有操作皆使用繁體中文。</p><div class="help-block"><h3>怎麼開始？</h3><ol><li>在總覽選擇國家、城市、出發日期與天數，建立獨立旅程；用上方選單切換城市。「自訂封面」可修改手帳標題與短句。已收錄 31 座城市的原創插畫，未收錄城市使用清楚標示的旅行風景。</li><li>在航班與住宿卡按「編輯」，替換範例資料。</li><li>每日行程可切換晴雨方案、編輯活動、記帳，並在下方自動保存每日手記。</li><li>待排靈感匣先收藏地點，再指定日期與時間。按住「拖曳」把手放到其他彈性卡片可排序；放到拖曳時出現的日期列可跨日移動。點一下把手也可選日期與時段。固定時間保留，重疊活動與待重查交通會提示。</li><li>住宿速查內可查官方警示、健康、入境與氣象資訊，也能下載公開資訊急難卡。</li><li>更換旅行天數後，日期、星期與統計會同步調整。</li></ol></div><div class="help-block"><h3>資料怎麼保存與分享？</h3><p>使用同一裝置、同一瀏覽器及相同網址開啟時，會讀取本機紀錄；私密模式、清除瀏覽資料或本機檔案限制可能使紀錄遺失，請定期備份。備份 JSON 可在另一台裝置匯入本 App。原始 HTML 不包含您後來輸入的資料；「我的旅程」可備份所有城市，匯入會新增為獨立旅程，不覆蓋原有資料。在「同步與分享」設定自己的雲端專案並登入後，可選擇將某趟旅程加入雲端，邀請旅伴檢視或共同編輯；其他本機旅程不會自動上傳。帳號權限與同步狀態會清楚顯示。</p></div><div class="help-block"><h3>離線與列印</h3><p>HTML 內含樣式、互動、SVG 插畫與 favicon。下載後可離線開啟；線上 Noto Sans TC 無法載入時使用裝置字型。Google 地圖與外部資訊需要網路。列印手帳會整理全部日期目前選擇的晴／雨版本、住宿、清單、手記與支出；可在列印視窗另存 PDF。</p><button class="button" data-action="print-book">${icon('download')}列印整本手帳</button></div><div class="help-block"><h3>範例與時間</h3><p>可自行選擇地點、日期與天數，從空白旅程開始；另可套用 2026/11/13–11/18 福岡六天五夜範例。航班為虛構範例，住宿為示範選擇而非真實訂房，餐廳安排、費用、營業時間與天氣均須出發前核對。時間預覽不會更改旅行日期；重新開啟網站回到實際日期。梅花為太宰府地區意象，不是十一月花況。</p></div><div class="help-block"><h3>公開資料來源</h3><ul class="source-list"><li><a href="https://www.boca.gov.tw/sp-trwa-list-1.html" target="_blank" rel="noopener noreferrer">外交部旅遊警示</a></li><li><a href="${SAFETY_INFO.officeURL}" target="_blank" rel="noopener noreferrer">駐福岡辦事處急難聯絡</a></li><li><a href="${SAFETY_INFO.health}" target="_blank" rel="noopener noreferrer">疾管署日本旅遊健康</a></li><li><a href="${SAFETY_INFO.visa}" target="_blank" rel="noopener noreferrer">日本外務省免簽規定</a></li><li><a href="https://www.japan.travel/en/plan/hotline/" target="_blank" rel="noopener noreferrer">日本觀光局緊急求助電話</a></li><li><a href="https://www.gofukuoka.jp/route/" target="_blank" rel="noopener noreferrer">福岡市官方旅遊路線</a></li><li><a href="https://dazaifutenmangu.or.jp/en/plan/getting-to-dazaifu-tenmangu/" target="_blank" rel="noo   }
  function todayCard(){const s=tripStatus(),i=s.kind==='during'?s.day:0,next=s.kind==='during'?s.next:getStops(0)[0];return `<article class="bookmark-card"><div class="bookmark-heading"><h2>${icon('pin')}${s.kind==='during'?'今天的書籤':'旅程書籤'}</h2><span class="badge">${s.kind==='after'?'旅途回顧':s.kind==='during'?'第 '+(i+1)+' 天':'從第一天開始'}</span></div><div class="bookmark-content"><div><p class="bookmark-day">${fmtDate(dateAt(i))}（${weekday(dateAt(i))}）${s.kind==='during'?'・下一站':''}</p><h3>${next?esc(next.title):s.kind==='after'?'翻翻這趟旅行的故事':'今天想去哪裡走走？'}</h3><p class="small muted">${next?`<span class="bookmark-time">${esc(next.time)}</span> ・預計停留 ${next.duration} 分鐘`:s.kind==='during'?'今天沒有後續安排，可以寫下旅途手記。':'加入想去的地方，留一點空白給偶遇。'}</p></div><div class="flow"><button class="button primary" data-action="go-day" data-index="${i}">${icon('calendar')}${s.kind==='during'?'看今天的行程':'打開行程'}</button>${next?mapButton(next.map,'地圖'):''}</div></div></article>`}
  function renderOverview(){
    const c=state.config;if(c.destination==='尚未選擇'){$('#overview').innerHTML=coverHTML()+plannerHTML();bindPlanner();return}

  function journalHTML(i){const j=state.days[i].journal||{highlight:'',note:''};return `<article class="card travel-journal" id="day-journal"><div class="journal-head"><h3>${icon('edit')}今天，想記住什麼？</h3><span>${fmtDate(dateAt(i))}・第 ${i+1} 頁</span></div><p class="muted">一碗喜歡的湯、一段走錯的路，都是自己的旅行。</p><div class="field"><label for="journal-highlight">今日的一個小發現</label><input id="journal-highlight" data-journal-field="highlight" maxlength="160" placeholder="例如：轉角那家咖啡店，想再去一次。" value="${esc(j.highlight)}"></div><div class="field"><label for="journal-note">我的旅途手記</label><textarea id="journal-note" data-journal-field="note" maxlength="5000" placeholder="寫下今天的心情、故事，或留給下次的自己。">${esc(j.note)}</textarea></div><p class="journal-save-status" id="journal-save-status" role="status">${j.highlight||j.note?'手記已保存在此瀏覽器':'輸入後自動保存在此瀏覽器；備份時會一起匯出。'}</p></article>`}
  document.addEventListener('input',e=>{const key=e.target.dataset.journalField;if(!['highlight','note'].includes(key))return;const day=state.days[selectedDay];day.journal={highlight:'',note:'',...day.journal,[key]:e.target.value.slice(0,key==='highlight'?160:5000)};save();$('#journal-save-status').textContent=storageOK?'手記已保存在此瀏覽器':'尚未保存，請先匯出備份';});

  const LIBRARY_KEY='travel-helper-library-v1';
  let tripLibrary={version:1,activeId:'',entries:[]},libraryReady=false;
  const activeTrip=()=>tripLibrary.entries.find(e=>e.id===tripLibrary.activeId);
  const currentHasCity=()=>state.config.destination!=='尚未選擇';
  function validateLibrary(raw){
    if(!raw||raw.version!==1||!Array.isArray(raw.entries)||!raw.entries.length||raw.entries.length>100)throw Error('invalid library');
    const ids=new Set();const entries=raw.entries.map(e=>{if(!e||typeof e.id!=='string'||!e.id||e.id.length>100||ids.has(e.id))throw Error('invalid trip id');ids.add(e.id);return{id:e.id,updatedAt:typeof e.updatedAt==='string'?e.updatedAt:new Date().toISOString(),data:validateState(e.data),cloud:validateCloudMeta(e.cloud)}});
    if(!ids.has(raw.activeId))throw Error('missing active trip');return{version:1,activeId:raw.activeId,entries};
  }
  function initializeLibrary(){
    let raw=null;try{raw=localStorage.getItem(LIBRARY_KEY);if(raw){tripLibrary=validateLibrary(JSON.parse(raw));state=structuredClone(activeTrip().data);libraryReady=true;return}}catch{loadProblem=true;try{if(raw&&!localStorage.getItem(LIBRARY_KEY+'-recovery'))localStorage.setItem(LIBRARY_KEY+'-recovery',raw)}catch{}}
    const entry={id:uid(),updatedAt:new Date().toISOString(),data:structuredClone(state),cloud:null};tripLibrary={version:1,activeId:entry.id,entries:[entry]};libraryReady=true;
  }
  function persistLibrary(){if(!libraryReady)return;const e=activeTrip();if(!e)throw Error('missing active trip');e.data=structuredClone(state);e.updatedAt=new Date().toISOString();localStorage.setItem(LIBRARY_KEY,JSON.stringify(tripLibrary))}
  function clearTripView(){if(typeof dragSession!=='undefined'&&dragSession)cancelCardDrag();clearTimeout(toastTimer);undoAction=null;$('#toast').hidden=true;selectedDay=0;dayModes={};filter='all';demoMode='real';if(dialog.open)dialog.close()}
  function switchTrip(id){if(id===tripLibrary.activeId)return;if(!tripLibrary.entries.some(e=>e.id===id))return;save();clearTripView();tripLibrary.activeId=id;state=validateState(structuredClone(activeTrip().data));save();renderAll();setPanel('overview',true);toast('已切換到 '+state.config.destination)}
  function addLibraryTrip(data,{cloud=null}={}){

  const initial=tripStatus();if(initial.kind==='during'){selectedDay=initial.day;renderItinerary();hydrateIcons();setPanel('itinerary')}
  initializeCloud();
  if(loadProblem)toast('儲存空間無法使用或舊資料讀取失敗；請先備份，避免遺失變更');
  setInterval(()=>{if(panel==='overview'&&$('#trip-counter')&&!dialog.open)$('#trip-counter').innerHTML=counterHTML()},1000);

  </script>
</body>
