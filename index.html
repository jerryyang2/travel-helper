  function flightCard(f,i){if(!f.fromCode&&!f.toCode)return `<article class="card"><h3>${i?'回程':'去程'}航班尚未設定</h3><p class="small muted" style="margin:10px 0 15px">依實際訂位填入機場、起降時間與時區。</p><button class="button" data-action="flight" data-index="${i}">編輯${i?'回程':'去程'}航班</button></article>`;const date=dateAt(i?state.config.days-1:0),arrivalDate=dateAt(f.arrivalDay,date);const mins=(zonedTime(arrivalDate,f.arrival,f.toZone)-zonedTime(date,f.departure,f.fromZone))/60000;const duration=mins>0?`${Math.floor(mins/60)} 小時 ${Math.round(mins%60)} 分`:'請確認日期與時區';return `<article class="card flight ${i?'return':''}"><div class="flight-top"><div class="flow"><span class="badge ${i?'green':'pink'}">${i?'回程':'去程'}</span><span class="small">${fmtDate(date)}（${weekday(date)}）</span>${ex(f.example)}</div><button class="text-button" data-action="flight" data-index="${i}" aria-label="編輯${i?'回程':'去程'}航班">編輯</button></div><div class="flight-body"><p class="small muted" style="margin-bottom:12px">${esc(f.airline||'尚未設定航空公司')} · ${esc(f.number||'待填航班')}</p><div class="airports"><div><div class="airport-code">${esc(f.fromCode||'—')}</div><p class="small">${esc(f.fromName||'出發機場待填')}</p><div class="flight-time mono-num">${esc(f.departure)}</div></div><div class="flight-route">${icon('plane')}<div>${duration}</div></div><div><div class="airport-code">${esc(f.toCode||'—')}</div><p class="small">${esc(f.toName||'抵達機場待填')}</p><div class="flight-time mono-num">${esc(f.arrival)}${f.arrivalDay?`<sup class="small">+${f.arrivalDay}</sup>`:''}</div></div></div><div class="flight-foot"><span>${esc(f.fromTerminal||'出發航廈待填')}<br>${esc(f.fromZone)}</span><span style="text-align:right">${esc(f.toTerminal||'抵達航廈待填')}<br>${esc(f.toZone)}</span></div><p class="small muted" style="margin-top:10px">起降均為當地時間${state.config.country==='日本'?'；日本比台灣快 1 小時':''}。</p><button class="text-button" data-action="quick-flight" data-index="${i}">${icon('wallet')} 記一筆機票費</button></div></article>`}
  function counterHTML(){const s=tripStatus();let label,cells,reminder;if(s.kind==='before'){let sec=Math.max(0,Math.floor((s.departure-s.now)/1000));cells=[Math.floor(sec/86400),Math.floor(sec%86400/3600),Math.floor(sec%3600/60),sec%60].map((n,i)=>[String(n).padStart(2,'0'),['天','時','分','秒'][i]]);label='距離出發，還有';reminder='收拾好行李，也留一點位置給期待。'}else if(s.kind==='during'){label=`正在旅行・第 ${s.day+1} 天`;const stops=getStops(s.day);cells=[[s.day+1,'旅行日'],[state.config.days,'總天數'],[stops.filter(a=>isDone(s.day,a.id)).length,'已完成'],[stops.length,'今日安排']];reminder=s.next?`下一站 ${s.next.time}｜${s.next.title}`:'今天已無後續安排，留點時間好好休息。'}else{label='旅程已結束，回憶還在';const total=new Set(state.days.flatMap((d,i)=>[...d.sunny,...d.rainy].map(a=>`${i}:${a.id}`)));cells=[[state.config.days,'天旅程'],[Math.max(0,state.config.days-1),'晚回憶'],[state.completed.filter(id=>total.has(id)).length,'已完成'],[state.expenses.length,'筆記帳']];reminder='下次想去哪裡？這本手帖，隨時都能再出發。'}return `<p class="status-label">${demoMode!=='real'?'<span class="badge yellow">展示模式</span> ':''}${label}</p><div class="counter mono-num">${cells.map(([n,l])=>`<div class="counter-cell"><strong>${esc(n)}</strong><span>${l}</span></div>`).join('')}</div><p class="trip-reminder">${esc(reminder)}</p>`}
  function todayCard(){const s=tripStatus();const i=s.kind==='during'?s.day:0;const next=s.kind==='during'?s.next:getStops(0)[0];return `<article class="card" style="background:var(--food);margin-bottom:20px"><div class="flex between"><div><div class="eyebrow">${icon('pin')}${s.kind==='during'?`今天・旅行第 ${i+1} 天`:'下一段風景'}</div><h3>${s.kind==='after'?'回顧這趟旅程':s.kind==='during'?esc(state.days[i].title):'從第一天開始期待'}</h3></div><span class="badge yellow">${demoMode==='real'?'旅行手帳':'展示模式'}</span></div><div style="margin-top:15px;background:white;border:var(--line);border-radius:12px;padding:15px"><p class="small muted">${s.kind==='after'?'旅程記錄':s.kind==='during'?'下一站':'第一站'}</p><p style="font-size:20px;font-weight:600">${next?`${esc(next.time)}　${esc(next.title)}`:s.kind==='during'?'今天已無後續行程':'行程等你來填'}</p><div class="flow" style="margin-top:12px"><button class="button primary" data-action="go-day" data-index="${i}">${icon('calendar')}${s.kind==='during'?'看今天的行程':'查看每日行程'}</button>${next?mapButton(next.map,'開啟地圖'):''}</div></div></article>`}
  function renderOverview(){const c=state.config;if(c.destination==='尚未選擇'){$('#overview').innerHTML=plannerHTML()+`<div class="card" style="padding:0;overflow:hidden">${genericArt()}<p style="padding:20px;text-align:center">不急著排滿每一天，先選一個想去的地方。</p></div>`;return}$('#overview').innerHTML=`${plannerHTML()}<div class="hero" ${c.destination==='尚未選擇'?'hidden':''}><div class="hero-art">${isFukuoka()?illustration():genericArt()}<span class="art-label">${isFukuoka()?'福岡河岸':'下一站，喜歡的地方'}・原創插畫</span></div><div class="hero-copy"><div class="flow"><span class="badge pink">${esc(c.country)}・${esc(c.destination)}</span><span class="badge green">${c.days} 天 ${Math.max(0,c.days-1)} 夜</span></div><h2 class="hero-title">${c.destination==='尚未選擇'?'從這裡，開始旅行。':esc(c.destination)+'，慢慢走。'}</h2><p class="hero-date">${fmtDate(dateAt(0),true)}（${weekday(dateAt(0))}）— ${fmtDate(dateAt(c.days-1))}（${weekday(dateAt(c.days-1))}）</p><div id="trip-counter">${counterHTML()}</div><div class="demo-control"><label for="demo-mode">時間預覽</label><select id="demo-mode"><option value="real" ${demoMode==='real'?'selected':''}>實際日期</option><option value="before" ${demoMode==='before'?'selected':''}>展示：出發前</option><option value="during" ${demoMode==='during'?'selected':''}>展示：旅途中</option></select></div>${c.template==='custom'?'<p class="small muted" style="margin-top:10px">空白行程可自行加入景點；天氣欄位仍是可編輯的範例。</p>':''}</div></div>${safetyEntry()}<div class="home-grid"><div class="flight-column"><h2 class="subheading">${icon('plane')}把期待裝進登機證</h2><div class="stack">${state.flights.map(flightCard).join('')}</div></div><div>${todayCard()}<article class="card"><h2 class="subheading">${icon('calendar')}這趟旅行的樣子</h2><div class="route-list">${state.days.map((d,i)=>`<div class="route-day"><span class="day-stamp">${i+1}</span><button data-action="go-day" data-index="${i}"><strong>${esc(d.title)}</strong><br><span class="small muted">${fmtDate(dateAt(i))}（${weekday(dateAt(i))}）・${getStops(i).length} 個安排</span></button></div>`).join('')}</div><div class="mini-stats"><div><span>已換算支出</span><strong>NT$${money(totalTWD())}</strong></div><div><span>行前準備</span><strong>${checkStats().percent}%</strong></div></div></article><p class="notice" style="margin-top:18px">自行填寫的航班、住宿與行程請依實際資料核對；帶有「範例」的內容僅為示範。</p></div></div>${backMenu()}`}
  function weatherHTML(day){const w=day.weather;if(w.unset)return `<div class="weather-line">${icon('cloud')}<strong>尚未填寫天氣</strong><span class="small muted">可在摘要中編輯</span></div>`;return `<div class="weather-line">${icon(w.kind)}<strong>${w.low}° / ${w.high}°</strong><span class="small">降雨 ${w.rain}%</span>${state.config.template==='custom'?'<span class="badge example">手動填寫</span>':ex(true)}</div>`}
  function summaryHTML(i){const d=state.days[i],h=state.hotels.find(h=>h.id===d.hotelId);return `<aside class="day-summary" aria-label="天氣與住宿摘要"><div class="summary-line">${weatherHTML(d)}<span class="small muted">${h?'今晚・'+esc(h.name):i===state.config.days-1?'今日退房／無住宿':'今晚住宿尚未設定'}</span></div><details class="summary-details"><summary>穿搭建議、住宿地址與地圖</summary><div class="summary-body"><div><p>${esc(d.weather.outfit)}</p><p class="muted">範例天氣，非預報與歷史觀測。</p><button class="text-button" data-action="day-edit">編輯每日摘要</button></div><div>${h?`<strong>${esc(h.name)}</strong>${ex(h.example)}<p>${esc(h.address)}</p><p>${esc(h.station)}・步行約 ${h.walk} 分鐘</p>${mapButton(h.map||h.address)}`:'<p>本日沒有設定住宿，可在「編輯每日摘要」選擇。</p>'}</div></div></details></aside>`}
  const TYPES={sight:['sight','觀光'],food:['food','美食'],shop:['shop','購物'],neutral:['bag','移動與休息']};
  function activityHTML(s,i,idx,print=false){const done=isDone(i,s.id),[ic,label]=TYPES[s.type];let details='';if(s.type==='food')details=`<div class="activity-meta">${s.cuisine?`<span>${esc(s.cuisine)}</span>`:''}${s.budget?`<span>${esc(s.budget)}</span>`:''}</div>${s.signature?`<p class="small"><strong>招牌菜色</strong>　${esc(s.signature)}</p>`:''}${s.booking?`<p class="activity-extra"><strong>訂位建議</strong>　${esc(s.booking)}</p>`:''}`;if(s.type==='shop')details=`${s.products?`<p class="small"><strong>推薦商品</strong>　${esc(s.products)}</p>`:''}${s.hours?`<p class="activity-extra">${esc(s.hours)}</p>`:''}${s.tax?`<p class="small muted" style="margin-top:7px">${esc(s.tax)}</p>`:''}`;return `<article class="activity ${s.type} ${done?'done':''}" style="--delay:${Math.min(idx,6)*45}ms" data-stop-id="${esc(s.id)}"><div class="activity-top"><span class="activity-time mono-num">${esc(s.time)}</span><span class="activity-type">${icon(ic)}${label}</span>${s.must?'<span class="badge pink">必去</span>':''}${fixedStop(s)?'<span class="badge fixed-time">固定時間</span>':''}${ex(s.example)}${s.transitReview?'<span class="badge review-badge">交通待確認</span>':''}${print?'':dragHandle(s)}</div><h3>${esc(s.title)}</h3><p class="activity-desc">${esc(s.desc)}</p><div class="activity-meta"><span>${icon('clock')} 預計停留 ${s.duration} 分鐘</span></div>${details}${s.notes?`<p class="activity-extra">${esc(s.notes)}</p>`:''}${print?'':`<div class="activity-bottom"><label class="check-label"><input type="checkbox" aria-label="完成：${esc(s.title)}" data-complete="${esc(s.id)}" ${done?'checked':''}>${done?'已完成':'標記完成'}</label><div class="activity-actions">${mapButton(s.map,'地圖')}<button class="button" data-action="quick-expense" data-id="${esc(s.id)}">${icon('wallet')}記一筆</button><button class="button icon-only" data-action="stop-edit" data-id="${esc(s.id)}" aria-label="編輯${esc(s.title)}">${icon('edit')}</button></div></div>`}</article>`}
  function transitHTML(s,prev,visibleAll=true){let route=s.transit||'交通尚未設定，請編輯此活動補上移動方式。';if(!visibleAll)route='篩選後的卡片不一定相鄰；交通指引請切回「全部」查看。';const ic=route.includes('地下鐵')||route.includes('西鐵')?'train':route.includes('巴士')?'bus':'walk';return `<div class="transit ${s.transitReview?'review-required':''}"><div class="flex">${icon(ic)}<strong>${esc(prev.title)} 至 ${esc(s.title)}</strong></div><p style="margin-left:28px">${s.transitReview?'<strong>原交通待重查：</strong>':''}${esc(route)}</p><small>${s.example?'範例估算・含轉乘與步行，非即時導航':'移動安排・請自行核對'}</small></div>`}
  function renderItinerary(animate=false){const i=selectedDay,d=state.days[i],all=getStops(),shown=all.filter(s=>filter==='all'||filter==='todo'&&!isDone(i,s.id)||filter==='must'&&s.must);$('#itinerary').innerHTML=`<div class="section-head"><div><h2>旅途中的每一天</h2><p class="muted">行程時間依 ${esc(state.config.timeZone)} 顯示。</p></div><button class="button" data-action="today">${icon('pin')}今天</button></div>${ideasHTML()}<div class="date-tabs" role="tablist" aria-label="選擇旅行日期">${state.days.map((day,n)=>`<button class="date-tab" role="tab" id="day-tab-${n}" aria-controls="day-content" aria-selected="${i===n}" tabindex="${i===n?'0':'-1'}" data-action="day" data-index="${n}"><span>第 ${n+1} 天</span><strong>${fmtDate(dateAt(n))}</strong><span>星期${weekday(dateAt(n))}</span></button>`).join('')}</div><div id="day-content" role="tabpanel" aria-labelledby="day-tab-${i}"><div class="day-toolbar"><div><h3>${esc(d.title)}</h3><p class="day-progress">${esc(d.subtitle)}</p></div><div class="segmented" aria-label="天氣替代方案"><button data-action="mode" data-mode="sunny" aria-pressed="${getMode()==='sunny'}">${icon('sun')}晴天</button><button data-action="mode" data-mode="rainy" aria-pressed="${getMode()==='rainy'}">${icon('rain')}雨天</button></div></div>${summaryHTML(i)}<div class="flow between" style="margin:0 0 20px"><div class="segmented" aria-label="行程篩選">${[['all','全部'],['todo','尚未完成'],['must','必去']].map(([v,l])=>`<button data-action="filter" data-filter="${v}" aria-pressed="${filter===v}">${l}</button>`).join('')}</div><span class="day-progress">已完成 ${all.filter(s=>isDone(i,s.id)).length} / ${all.length} 個安排</span></div><details class="card" style="padding:13px 18px;margin-bottom:20px"><summary style="cursor:pointer;font-weight:600">${icon('train')} 當日移動速覽</summary><p class="small muted" style="margin-top:8px">${all.map(s=>esc(s.title)).join(' ／ ')}</p><p class="small muted" style="margin-top:8px">交通段為範例估算；每段詳細路線請看下方時間軸，地圖可查看各站位置。</p><div class="flow" style="margin-top:12px">${all.map(s=>s.map?`<a class="badge" href="${esc(mapURL(s.map))}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a>`:'').join('')}</div></details><div class="arrange-tools"><button class="button" data-action="arrange-toggle" aria-pressed="${arranging}">${arranging?'展開完整卡片':'精簡卡片，方便拖曳'}</button><p>按住「拖曳」把手排序；拖到下方日期可跨日。點把手也能選日期。</p></div>${reviewNotice(all)}${scheduleNotice(all)}<div class="timeline ${arranging?'arranging':''} ${animate?'reveal':''}">${shown.length?shown.map((s,n)=>`${n?transitHTML(s,shown[n-1],filter==='all'):''}${activityHTML(s,i,n)}`).join(''):'<div class="empty card">這個篩選下沒有行程。切換「全部」，或新增想去的地方。</div>'}</div><div class="add-stop"><button class="button" data-action="stop-add">${icon('plus')}新增${getMode()==='rainy'?'雨天':'晴天'}行程</button></div><div class="daily-bottom" id="daily-expenses">${dailyExpenses(i)}</div></div>${backMenu()}`}
  function expenseRows(expenses){return expenses.length?`<ul class="expense-list">${expenses.map(e=>`<li class="expense-row"><span class="expense-name">${esc(e.name)}<br><span class="small muted">${esc(e.category)}・${exchangeRate(e.currency)===null?'待設定匯率':'約 NT$'+money(expenseTWD(e))}</span></span><strong>${amountLabel(e.amount,e.currency)}</strong><button class="button icon-only" data-action="expense-edit" data-id="${esc(e.id)}" aria-label="編輯支出${esc(e.name)}">${icon('edit')}</button><button class="text-button" data-action="expense-delete" data-id="${esc(e.id)}" aria-label="刪除支出${esc(e.name)}">${icon('trash')}</button></li>`).join('')}</ul>`:'<p class="empty">今天還沒有記帳，先記下第一筆吧。</p>'}

  function renderChecklist(){const s=checkStats();$('#checklist').innerHTML=`<div class="section-head"><div><h2>準備好，就安心出發</h2><p class="muted">把瑣碎的小事，一件一件收好。</p></div></div><div class="card check-total"><div><strong>${s.percent}%</strong><p class="small muted">準備進度</p></div><div class="progress-section"><div class="flow between"><span>已完成 ${s.done} 項</span><span class="small muted">共 ${s.total} 項</span></div><div class="progress-bar" role="progressbar" aria-label="行前準備進度" aria-valuenow="${s.percent}" aria-valuemin="0" aria-valuemax="100"><span style="width:${s.percent}%"></span></div></div></div><div class="grid-2">${[['todo','checklist','行前待辦'],['packing','bag','行李準備']].map(([key,ic,title])=>`<article class="card"><div class="flex between"><h3 class="flex">${icon(ic)}${title}</h3><span class="badge green">${state.checklists[key].filter(a=>a.done).length} / ${state.checklists[key].length}</span></div><ul class="check-list">${state.checklists[key].map(a=>`<li class="check-row ${a.done?'completed':''}"><label><input type="checkbox" data-check-id="${esc(a.id)}" data-group="${key}" ${a.done?'checked':''}><span>${esc(a.text)}</span></label><button data-action="check-delete" data-group="${key}" data-id="${esc(a.id)}" aria-label="移除${esc(a.text)}">${icon('close')}</button></li>`).join('')||'<li class="empty">尚未建立清單，加入第一個項目吧。</li>'}</ul><form class="add-check-form" data-check-form="${key}"><div class="field"><label for="new-${key}">新增項目</label><input id="new-${key}" name="text" placeholder="還有什麼要準備？" maxlength="300" required></div><button class="button" type="submit" aria-label="新增${title}">${icon('plus')}</button></form></article>`).join('')}</div>${backMenu()}`}

  function budgetHTML(){const sum=totalTWD(),remaining=state.config.budget-sum,categories=['餐飲','交通','購物','住宿','機票','其他'];return `<article class="card" style="margin-top:24px"><div class="flow between"><h3 class="flex">${icon('wallet')}這趟旅行的花費</h3><button class="text-button" data-action="settings">預算與匯率設定</button></div><div class="budget-top"><div><span class="small muted">已換算總支出</span><strong>NT$${money(sum)}</strong><span class="small muted">共 ${state.expenses.length} 筆・${currencyName(tripCurrency())} ${amountLabel(totalForeign(),tripCurrency())}</span></div><div><span class="small muted">${remaining<0?'超出預算':'預算餘額'}</span><strong style="font-size:24px;color:${remaining<0?'#AD2E22':'var(--green)'}">NT$${money(Math.abs(remaining))}</strong><span class="small muted">預算 NT$${money(state.config.budget)}</span></div></div><div class="progress-bar" role="progressbar" aria-label="預算使用比例" aria-valuenow="${state.config.budget?Math.min(100,Math.round(sum/state.config.budget*100)):0}" aria-valuemin="0" aria-valuemax="100"><span style="width:${state.config.budget?Math.min(100,sum/state.config.budget*100):0}%;background:${remaining<0?'var(--red)':'var(--green)'}"></span></div>${conversionNote()}<div class="budget-bars">${categories.map((cat,i)=>{const value=state.expenses.filter(e=>e.category===cat).reduce((a,e)=>a+expenseTWD(e),0);return `<div class="budget-row"><span>${cat}</span><div class="budget-track"><span style="width:${sum?value/sum*100:0}%;background:${['var(--yellow)','var(--blue)','var(--pink)','var(--green)','var(--navy)','var(--muted)'][i]}"></span></div><strong>NT$${money(value)}</strong></div>`}).join('')}</div><table class="budget-table"><caption class="sr-only">每日支出統計</caption><thead><tr><th scope="col">日期</th><th scope="col">旅行幣別支出</th><th scope="col">換算合計</th></tr></thead><tbody>${state.days.map((d,i)=>`<tr><td>${fmtDate(dateAt(i))}・第 ${i+1} 天</td><td>${amountLabel(totalForeign(i),tripCurrency())}</td><td>NT$${money(state.expenses.filter(e=>e.day===i).reduc   function renderStay(){const jp=state.config.country.trim()==='日本';$('#stay').innerHTML=`<div class="section-head"><div><h2>把重要資訊，放在一起</h2><p class="muted">住宿、預約與旅行花費，隨手就能找到。</p></div><button class="button" data-action="hotel-add">${icon('plus')}新增住宿</button></div><div class="grid-2">${state.hotels.map(hotelHTML).join('')||'<p class="empty card">尚未新增住宿。</p>'}</div>${safetyHub()}<div class="practical-grid">${destinationNotes()}<article class="card"><div class="flow between"><h3 class="flex">${icon('info')}預約與安心速查</h3><button class="text-button" data-action="practical">編輯</button></div><dl class="info-grid"><div class="full"><dt>餐廳預約／訂位編號</dt><dd>${esc(state.practical.restaurant||'待填寫')}</dd></div><div class="full"><dt>保險資料</dt><dd>${esc(state.practical.insurance||'待填寫')}</dd></div><div class="full"><dt>海外協助電話</dt><dd>${esc(state.practical.assistance||'待填寫')}</dd></div></dl><h3 style="font-size:17px">旅途緊急聯絡</h3>${jp?`<div class="emergency-grid"><a class="emergency" href="tel:110"><span>警察</span><strong>110</strong></a><a class="emergency" href="tel:119"><span>消防／救護</span><strong>119</strong></a></div><button class="button" style="width:100%;margin-top:14px" data-action="sos">${icon('phone')}SOS 求助卡・放大顯示</button>`:'<p class="notice" style="margin-top:10px">請到上方安心查詢確認當地緊急電話與駐外館處，並在預約與保險資料中記下重要聯絡方式。</p>'}<p class="small muted" style="margin-top:14px">訂位與保險欄位預載無效範例；匯出分享前請檢查個人資料。</p></article></div>${budgetHTML()}${backMenu()}`}

  function conflicts(stops){const minutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3));const result=[];for(let i=0;i<stops.length;i++)for(let j=i+1;j<stops.length;j++){const a=stops[i],b=stops[j];if(minutes(b.time)<minutes(a.time)+a.duration&&minutes(a.time)<minutes(b.time)+b.duration)result.push([a,b])}return result}
  function scheduleNotice(stops){const overlaps=conflicts(stops);return overlaps.length?`<aside class="schedule-warning" role="status"><strong>有 ${overlaps.length} 組活動時間重疊</strong>${overlaps.slice(0,3).map(([a,b])=>`<p>${esc(a.time)} ${esc(a.title)} ／ ${esc(b.time)} ${esc(b.title)}</p>`).join('')}<p>請調整開始時間或停留長度；此檢查未包含交通時間。</p></aside>`:''}

  function help(){openDialog('讓旅行手帖陪你出發',`<p>這是一份可自行編輯的單檔旅遊 App，所有操作皆使用繁體中文。</p><div class="help-block"><h3>怎麼開始？</h3><ol><li>在總覽選擇國家、城市、出發日期與天數，建立空白旅程；既有旅程可用「編輯旅程」修改設定。</li><li>在航班與住宿卡按「編輯」，替換範例資料。</li><li>每日行程可切換晴雨方案、編輯活動與記帳。</li><li>待排靈感匣先收藏地點，再指定日期與時間。按住「拖曳」把手放到其他彈性卡片可排序；放到拖曳時出現的日期列可跨日移動。點一下把手也可選日期與時段。固定時間保留，重疊活動與待重查交通會提示。</li><li>住宿速查內可查官方警示、健康、入境與氣象資訊，也能下載公開資訊急難卡。</li><li>更換旅行天數後，日期、星期與統計會同步調整。</li></ol></div><div class="help-block"><h3>資料怎麼保存與分享？</h3><p>使用同一裝置、同一瀏覽器及相同網址開啟時，會讀取本機紀錄；私密模式、清除瀏覽資料或本機檔案限制可能使紀錄遺失，請定期備份。備份 JSON 可在另一台裝置匯入本 App。原始 HTML 不包含您後來輸入的資料；目前沒有雲端共編或自動同步。</p></div><div class="help-block"><h3>離線與列印</h3><p>HTML 內含樣式、互動、SVG 插畫與 favicon。下載後可離線開啟；線上 Noto Sans TC 無法載入時使用裝置字型。Google 地圖與外部資訊需要網路。列印手帳會整理全部日期目前選擇的晴／雨版本、住宿、清單與支出；可在列印視窗另存 PDF。</p><button class="button" data-action="print-book">${icon('download')}列印整本手帳</button></div><div class="help-block"><h3>範例與時間</h3><p>可自行選擇地點、日期與天數，從空白旅程開始；另可套用 2026/11/13–11/18 福岡六天五夜範例。航班為虛構範例，住宿為示範選擇而非真實訂房，餐廳安排、費用、營業時間與天氣均須出發前核對。時間預覽不會更改旅行日期；重新開啟網站回到實際日期。梅花為太宰府地區意象，不是十一月花況。</p></div><div class="help-block"><h3>公開資料來源</h3><ul class="source-list"><li><a href="https://www.boca.gov.tw/sp-trwa-list-1.html" target="_blank" rel="noopener noreferrer">外交部旅遊警示</a></li><li><a href="${SAFETY_INFO.officeURL}" target="_blank" rel="noopener noreferrer">駐福岡辦事處急難聯絡</a></li><li><a href="${SAFETY_INFO.health}" target="_blank" rel="noopener noreferrer">疾管署日本旅遊健康</a></li><li><a href="${SAFETY_INFO.visa}" target="_blank" rel="noopener noreferrer">日本外務省免簽規定</a></li><li><a href="https://www.japan.travel/en/plan/hotline/" target="_blank" rel="noopener noreferrer">日本觀光局緊急求助電話</a></li><li><a href="https://www.gofukuoka.jp/route/" target="_blank" rel="noopener noreferrer">福岡市官方旅遊路線</a></li><li><a href="https://dazaifutenmangu.or.jp/en/plan/getting-to-dazaifu-tenmangu/" target="_blank" rel="noopener noreferrer">太宰府天滿宮交通</a></li><li><a href="https://www.fukuoka-airport.jp/flight/transit/" target="_blank" rel="noopener noreferrer">福岡機場航廈接駁</a></l   // 同日保留固定行程的位置與時間，彈性卡片重排後承接既有彈性時間格。
  function prepareCardMove(source,target,id,targetId=null,newTime=null){
    const at=source.findIndex(s=>s.id===id);if(at<0)throw Error('找不到這個安排');

    if(source===target){
      const slots=source.filter(s=>!fixedStop(s)),a=slots.findIndex(s=>s.id===id),b=slots.findIndex(s=>s.id===targetId);
      if(b<0)throw Error('請放到其他彈性行程的時間格');if(a===b)return null;
      const times=slots.map(s=>s.time),ordered=structuredClone(slots),item=ordered.splice(a,1)[0];ordered.splice(b,0,item);
      ordered.forEach((s,i)=>s.time=times[i]);let n=0;
      return{source:source.map(s=>fixedStop(s)?structuredClone(s):ordered[n++]),target:null};
    }
    if(target.length>=100)throw Error('目的日期已達 100 個安排，請選擇其他日期');
    if(target.some(s=>s.id===id))throw Error('目的日期已有這個安排，請先確認內容');
